# ============================================================================
# TRILOK TRACE — Alembic configuration (single-head chain, DATABASE.md §14)
#
# The database URL is injected by backend/alembic/env.py from app settings —
# never hard-code credentials here. Override at the CLI for one-off targets:
#   alembic -x db_url=postgresql+psycopg://user:pass@host:5432/trilok_trace upgrade head
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# required by Alembic's Config even when env.py supplies the URL programmatically
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
